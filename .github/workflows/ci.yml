name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for package.json
        id: check_files
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> $GITHUB_OUTPUT
          else
            echo "has_package_json=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.check_files.outputs.has_package_json == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_files.outputs.has_package_json == 'true'
        run: npm ci

      - name: Type check
        if: steps.check_files.outputs.has_package_json == 'true'
        run: npm run check

      - name: Lint
        if: steps.check_files.outputs.has_package_json == 'true'
        run: npm run lint
        continue-on-error: true

      - name: Build
        if: steps.check_files.outputs.has_package_json == 'true'
        run: npm run build
